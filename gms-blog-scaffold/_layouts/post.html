---
layout: default
---
<article class="post">
  <div class="wrap post-wrap">
    <a class="back" href="/blog/">&larr; Journal</a>
    <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}{% if page.category %} &middot; {{ page.category }}{% endif %}</p>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-body">
      {{ content }}
    </div>
    <hr class="seam-hr">
    <a class="back" href="/blog/">&larr; Back to the Journal</a>
  </div>
</article>
